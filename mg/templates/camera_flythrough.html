<!doctype html>
<!-- camera_flythrough: the camera flies through floating cards (images and/or words) and lands on the last
     one. Montage intros, "5 tools in 5 seconds", portfolio reels.
     data: {images: ["C:/path/a.jpg", ...], words: ["IDEA", "EDIT", ...], style: tunnel|gallery|spiral,
            accent: "#hex", card: "#hex" (word cards), end_text, duration} -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/__mg/base.css">
<script type="importmap">{"imports": {"three": "/__vendor/three/build/three.module.js", "three/addons/": "/__vendor/three/examples/jsm/"}}</script>
</head><body><div id="stage" data-composition-id="main"></div>
<script type="module">
import { THREE, D, stage, view, run, ease, seg, clamp, lerp, rand, fontsReady, textCanvas, canvasTexture, loadTexture,
         roundedRect, ready } from "/__mg/three-kit.js";
const d = D({ images: [], words: [], style: "tunnel", accent: "#FFE14D", card: "#15161c", end_text: "", seed: 3, duration: 5 });
document.getElementById("stage").dataset.duration = d.duration;

function wordCard(text, accent, bg) {
  const tc = textCanvas(text, { size: 150, weight: 900, color: "#ffffff" });
  const c = document.createElement("canvas");
  c.width = Math.max(720, tc.w + 160); c.height = 440;
  const x = c.getContext("2d");
  x.fillStyle = bg; x.beginPath(); x.roundRect(0, 0, c.width, c.height, 46); x.fill();
  x.strokeStyle = accent; x.lineWidth = 10; x.beginPath(); x.roundRect(5, 5, c.width - 10, c.height - 10, 42); x.stroke();
  x.drawImage(tc.canvas, (c.width - tc.w) / 2, (c.height - tc.h) / 2);
  return canvasTexture(c);
}

function cardMesh(tex, w, h) {
  const g = new THREE.ShapeGeometry(roundedRect(w, h, Math.min(w, h) * 0.06), 10);
  const uv = g.attributes.uv, pos = g.attributes.position;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, pos.getX(i) / w + 0.5, pos.getY(i) / h + 0.5);
  return new THREE.Mesh(g, new THREE.MeshBasicMaterial({ map: tex, transparent: true, toneMapped: false, side: THREE.DoubleSide }));
}

ready((async () => {
  const st = stage({ fov: 55, env: false });
  const { scene, camera, renderer } = st;
  await fontsReady([`900 150px "Poppins"`, `700 150px "Hind Siliguri"`]);
  const items = [];
  for (const p of d.images || []) {
    try { const t = await loadTexture(p, renderer); items.push({ tex: t, ar: t.image.width / t.image.height }); } catch { /* skip */ }
  }
  for (const w of d.words || []) items.push({ tex: wordCard(w, d.accent, d.card), ar: 0 });
  if (d.end_text) items.push({ tex: wordCard(d.end_text, d.accent, d.accent === "#ffffff" ? "#000" : d.card), ar: 0, end: true });
  if (!items.length) ["IDEA", "SHOOT", "EDIT", "POST"].forEach((w) => items.push({ tex: wordCard(w, d.accent, d.card), ar: 0 }));
  items.forEach((it) => { if (!it.ar) it.ar = it.tex.image.width / it.tex.image.height; });

  const R = rand(d.seed);
  const gap = 7;
  const cards = items.map((it, i) => {
    const h = 2.2, w = h * it.ar;
    const m = cardMesh(it.tex, Math.min(w, 4.2), Math.min(w, 4.2) / it.ar);
    const last = i === items.length - 1;
    let x = 0, y = 0;
    if (!last) {
      if (d.style === "spiral") { const a = i * 1.9; x = Math.cos(a) * 2.2; y = Math.sin(a) * 2.2; }
      else if (d.style === "gallery") { x = (i % 2 ? 1 : -1) * 2.4; y = (R() - 0.5) * 1.2; }
      else { const a = R() * Math.PI * 2; x = Math.cos(a) * 1.8; y = Math.sin(a) * 2.6; }
    }
    m.position.set(x, y, -i * gap);
    m.rotation.set((R() - 0.5) * 0.2 * (last ? 0 : 1), (x > 0 ? -1 : 1) * 0.35 * (last ? 0 : 1), (R() - 0.5) * 0.2 * (last ? 0 : 1));
    scene.add(m);
    return m;
  });
  const lastZ = -(items.length - 1) * gap;
  const lastCard = cards[cards.length - 1];
  const fit = (() => {                       // distance where the last card fills ~80% of the width
    const w = lastCard.geometry.boundingBox || (lastCard.geometry.computeBoundingBox(), lastCard.geometry.boundingBox);
    const cw = w.max.x - w.min.x;
    const vfov = THREE.MathUtils.degToRad(camera.fov);
    const hfov = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect);
    return (cw / 0.8) / 2 / Math.tan(hfov / 2);
  })();
  const D0 = d.duration;
  const zStart = 6, zEnd = lastZ + fit;
  run(st, (t) => {
    const p = ease.inOut(seg(t, 0, D0 * 0.92));
    const z = lerp(zStart, zEnd, p);
    const sway = (1 - p) * 0.5;
    camera.position.set(Math.sin(t * 0.9) * sway, Math.cos(t * 0.7) * sway * 0.6, z);
    camera.lookAt(camera.position.x * 0.5, camera.position.y * 0.5, z - 10);
    camera.rotation.z = Math.sin(t * 0.6) * 0.08 * (1 - p);
    cards.forEach((c, i) => {
      const dz = camera.position.z - c.position.z;           // > 0: in front of the camera
      const near = clamp((dz - 0.4) / 2.0), far = clamp(1 - (dz - 4 * gap) / (2 * gap));
      c.material.opacity = near * far * ease.out(seg(t, 0, 0.3));
    });
  }, D0);
})());
</script></body></html>
