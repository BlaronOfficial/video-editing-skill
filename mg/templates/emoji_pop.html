<!doctype html>
<!-- emoji_pop: big emoji bounces in with a deterministic particle burst. data: {emoji: "🔥", x: 0.5, y: 0.35,
     size: 1.0, particles: 14, duration, brand} -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/__mg/base.css">
<style>
  .e { position: absolute; transform: translate(-50%, -50%); font-size: 22vmin; line-height: 1; filter: drop-shadow(0 1vmin 2vmin rgba(0,0,0,.35)); }
  .p { position: absolute; width: 2.2vmin; height: 2.2vmin; border-radius: 50%; transform: translate(-50%, -50%); }
</style></head>
<body><div id="stage" data-composition-id="main"><div class="e" id="e"></div></div>
<script src="/__vendor/gsap.min.js"></script><script src="/__mg/vedit.js"></script>
<script>
const d = V.data({ emoji: "🔥", x: 0.5, y: 0.35, size: 1, particles: 14, duration: 1.8 });
V.brand(d.brand || {});
const stage = document.getElementById("stage"), e = document.getElementById("e");
e.textContent = d.emoji; e.style.left = (d.x * 100) + "%"; e.style.top = (d.y * 100) + "%"; e.style.fontSize = (22 * d.size) + "vmin";
stage.dataset.duration = d.duration;
const rnd = V.rand(7), cs = getComputedStyle(document.documentElement);
const colors = [cs.getPropertyValue("--accent"), cs.getPropertyValue("--accent-2"), "#ffffff"];
const tl = V.timeline("main");
tl.from(e, { scale: 0, rotation: -25, duration: 0.55, ease: "elastic.out(1, 0.42)" }, 0)
  .to(e, { rotation: 8, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0.5);
for (let i = 0; i < d.particles; i++) {
  const p = document.createElement("div"); p.className = "p"; p.style.background = colors[i % 3];
  p.style.left = (d.x * 100) + "%"; p.style.top = (d.y * 100) + "%"; stage.appendChild(p);
  const ang = (i / d.particles) * Math.PI * 2 + rnd() * 0.4, dist = Math.min(innerWidth, innerHeight) * (0.18 + rnd() * 0.12);
  tl.fromTo(p, { x: 0, y: 0, scale: 1, opacity: 1 }, { x: Math.cos(ang) * dist, y: Math.sin(ang) * dist, scale: 0, opacity: 0,
    duration: 0.7 + rnd() * 0.3, ease: "power3.out" }, 0.08);
}
tl.to(e, { scale: 0, opacity: 0, duration: 0.25, ease: "back.in(2)" }, Math.max(0.9, d.duration - 0.25));
</script></body></html>
