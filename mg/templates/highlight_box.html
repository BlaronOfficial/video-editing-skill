<!doctype html>
<!-- highlight_box: rounded rectangle draws around a region (screen recordings, UI, products), optional dim outside and label.
     data: {box: [x, y, w, h] (0..1), label, dim: 0.45, radius: 2 (vmin), duration, brand} -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/__mg/base.css">
<style>
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stroke { fill: none; stroke: var(--accent); stroke-width: .9vmin; filter: drop-shadow(0 0 1.2vmin var(--accent)); }
  .label { position: absolute; transform: translateY(-120%); background: var(--accent); color: var(--ink); font-weight: 800;
           font-size: 3.8vmin; padding: 1vmin 2vmin; border-radius: 1.2vmin; white-space: nowrap; }
</style></head>
<body><div id="stage" data-composition-id="main">
  <svg><defs><mask id="m"><rect width="100%" height="100%" fill="white"/><rect id="hole" fill="black"/></mask></defs>
    <rect id="dim" width="100%" height="100%" fill="black" mask="url(#m)"/><rect id="r" class="stroke"/></svg>
  <div class="label" id="label"></div>
</div>
<script src="/__vendor/gsap.min.js"></script><script src="/__mg/vedit.js"></script>
<script>
const d = V.data({ box: [0.2, 0.35, 0.6, 0.18], label: "", dim: 0.45, radius: 2, duration: 3 });
V.brand(d.brand || {});
const W = innerWidth, H = innerHeight, rad = Math.min(W, H) * d.radius / 100;
const [x, y, w, h] = [d.box[0] * W, d.box[1] * H, d.box[2] * W, d.box[3] * H];
for (const id of ["r", "hole"]) { const el = document.getElementById(id);
  Object.entries({ x, y, width: w, height: h, rx: rad }).forEach(([k, v]) => el.setAttribute(k, v)); }
const label = document.getElementById("label");
if (d.label) { label.textContent = d.label; label.style.left = x + "px"; label.style.top = y + "px"; } else label.remove();
document.getElementById("stage").dataset.duration = d.duration;
const r = document.getElementById("r"), L = 2 * (w + h);
gsap.set(r, { strokeDasharray: L, strokeDashoffset: L });
gsap.set("#dim", { opacity: 0 });
const tl = V.timeline("main");
tl.to("#dim", { opacity: d.dim, duration: 0.4, ease: "power2.out" }, 0)
  .to(r, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 0.1);
if (d.label) tl.from(label, { y: 20, opacity: 0, duration: 0.35, ease: "back.out(2)" }, 0.5);
tl.to(["#dim", r, label].filter(Boolean), { opacity: 0, duration: 0.3 }, Math.max(1.2, d.duration - 0.3));
</script></body></html>
