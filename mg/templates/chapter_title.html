<!doctype html>
<!-- chapter_title: outlined big number + chapter name with a drawn rule. Great for long-form sections.
     data: {number: "01", title: "The setup", align: left|center, y: 0.5, panel: false, duration, brand} -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/__mg/base.css">
<style>
  .wrap { position: absolute; left: 8vw; right: 8vw; transform: translateY(-50%); }
  .wrap.center { text-align: center; }
  .num { font-family: "Anton", var(--font-display); font-size: 26vmin; line-height: .9; color: transparent;
         -webkit-text-stroke: .5vmin var(--accent); }
  .rule { height: .7vmin; background: var(--accent); width: 30vmin; margin: 2vmin 0; transform-origin: left; }
  .center .rule { margin: 2vmin auto; transform-origin: center; }
  .t { font-weight: 900; font-size: 8.6vmin; color: var(--paper); letter-spacing: -0.02em; text-shadow: 0 .6vmin 2vmin rgba(0,0,0,.45); }
</style></head>
<body><div id="stage" data-composition-id="main"><div class="wrap" id="wrap"><div class="num" id="num"></div><div class="rule" id="rule"></div><div class="t" id="t"></div></div></div>
<script src="/__vendor/gsap.min.js"></script><script src="/__mg/vedit.js"></script>
<script>
const d = V.data({ number: "01", title: "The setup", align: "left", y: 0.5, duration: 2.8 });
V.brand(d.brand || {});
const wrap = document.getElementById("wrap"); wrap.style.top = (d.y * 100) + "%"; if (d.align === "center") wrap.classList.add("center");
document.getElementById("num").textContent = d.number;
const t = document.getElementById("t"); t.textContent = d.title; if (V.isBangla(d.title)) t.classList.add("bn");
const { words } = V.split(t);
document.getElementById("stage").dataset.duration = d.duration;
const tl = V.timeline("main");
tl.from("#num", { x: -80, opacity: 0, duration: 0.6, ease: "expo.out" }, 0)
  .from("#rule", { scaleX: 0, duration: 0.5, ease: "expo.out" }, 0.2)
  .from(words, { yPercent: 100, opacity: 0, duration: 0.5, ease: "expo.out", stagger: 0.06 }, 0.3)
  .to(wrap, { opacity: 0, x: 60, duration: 0.35, ease: "power2.in" }, Math.max(1.4, d.duration - 0.35));
</script></body></html>
