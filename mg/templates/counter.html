<!doctype html>
<!-- counter: number counts up with a glow pop at the end. data: {from: 0, to: 10000, prefix: "$", suffix: "",
     decimals: 0, label: "in 30 days", y: 0.45, duration, brand} -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/__mg/base.css">
<style>
  .box { position: absolute; left: 0; right: 0; text-align: center; transform: translateY(-50%); }
  .num { font-weight: 900; font-size: 20vmin; color: var(--paper); letter-spacing: -0.04em; font-variant-numeric: tabular-nums;
         text-shadow: 0 1vmin 4vmin rgba(0,0,0,.45); }
  .num .affix { color: var(--accent); }
  .label { margin-top: 1vmin; font-weight: 700; font-size: 4.6vmin; color: rgba(255,255,255,.92); text-transform: uppercase;
           letter-spacing: .12em; text-shadow: 0 .3vmin 1.2vmin rgba(0,0,0,.5); }
</style></head>
<body><div id="stage" data-composition-id="main">
  <div class="box" id="box"><div class="num"><span class="affix" id="pre"></span><span id="val">0</span><span class="affix" id="suf"></span></div>
  <div class="label" id="label"></div></div>
</div>
<script src="/__vendor/gsap.min.js"></script><script src="/__mg/vedit.js"></script>
<script>
const d = V.data({ from: 0, to: 10000, prefix: "$", suffix: "", decimals: 0, label: "in 30 days", y: 0.45, duration: 3 });
V.brand(d.brand || {});
document.getElementById("box").style.top = (d.y * 100) + "%";
document.getElementById("pre").textContent = d.prefix || "";
document.getElementById("suf").textContent = d.suffix || "";
const label = document.getElementById("label");
if (d.label) { label.textContent = d.label; if (V.isBangla(d.label)) label.classList.add("bn"); } else label.remove();
document.getElementById("stage").dataset.duration = d.duration;
const val = document.getElementById("val");
const fmt = (n) => Number(n).toLocaleString("en-US", { minimumFractionDigits: d.decimals, maximumFractionDigits: d.decimals });
const state = { n: d.from };
const tl = V.timeline("main");
const countDur = Math.min(1.6, d.duration * 0.55);
tl.from("#box", { scale: 0.6, opacity: 0, duration: 0.35, ease: "back.out(2)" }, 0)
  .to(state, { n: d.to, duration: countDur, ease: "power3.out", onUpdate: () => { val.textContent = fmt(state.n); } }, 0.1)
  .to(".num", { scale: 1.12, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, 0.1 + countDur)
  .from(label, { y: 20, opacity: 0, duration: 0.4, ease: "power3.out" }, 0.3)
  .to("#box", { opacity: 0, y: -20, duration: 0.3, ease: "power2.in" }, Math.max(1.2, d.duration - 0.3));
val.textContent = fmt(d.from);
</script></body></html>
