<!doctype html>
<!-- list_reveal: heading + items that slide in with self-drawing check marks.
     data: {heading: "3 things", items: ["One", "Two", "Three"], times: [..] (optional), y: 0.5, panel: true, duration, brand} -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/__mg/base.css">
<style>
  .card { position: absolute; left: 7vw; right: 7vw; transform: translateY(-50%); padding: 4.5vmin 4.5vmin 3vmin;
          border-radius: 3vmin; }
  .card.panel { background: rgba(12,12,16,.74); backdrop-filter: blur(14px); box-shadow: 0 2vmin 6vmin rgba(0,0,0,.4); }
  .h { font-weight: 900; font-size: 6.4vmin; color: var(--accent); margin-bottom: 2.6vmin; letter-spacing: -0.02em; }
  .item { display: flex; align-items: center; gap: 2.4vmin; font-weight: 700; font-size: 5vmin; color: var(--paper);
          margin: 0 0 2.2vmin; text-shadow: 0 .3vmin 1vmin rgba(0,0,0,.4); }
  .chk { flex: none; width: 6vmin; height: 6vmin; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
  .chk svg { width: 60%; height: 60%; }
  .chk path { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
</style></head>
<body><div id="stage" data-composition-id="main"><div class="card" id="card"><div class="h" id="h"></div><div id="list"></div></div></div>
<script src="/__vendor/gsap.min.js"></script><script src="/__mg/vedit.js"></script>
<script>
const d = V.data({ heading: "3 editing rules", items: ["Cut the pauses", "Hook in 1 second", "Captions always"], times: null,
                   y: 0.5, panel: true, duration: 5 });
V.brand(d.brand || {});
const card = document.getElementById("card");
card.style.top = (d.y * 100) + "%";
if (d.panel) card.classList.add("panel");
const h = document.getElementById("h");
if (d.heading) { h.textContent = d.heading; if (V.isBangla(d.heading)) h.classList.add("bn"); } else h.remove();
const list = document.getElementById("list");
const rows = d.items.map((txt) => {
  const r = document.createElement("div"); r.className = "item";
  r.innerHTML = `<div class="chk"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></svg></div><div class="t"></div>`;
  r.querySelector(".t").textContent = txt; if (V.isBangla(txt)) r.classList.add("bn");
  list.appendChild(r); return r;
});
document.getElementById("stage").dataset.duration = d.duration;
const tl = V.timeline("main");
if (d.panel) tl.from(card, { scale: 0.94, opacity: 0, duration: 0.45, ease: "expo.out" }, 0);
if (d.heading) tl.from(h, { y: 20, opacity: 0, duration: 0.4, ease: "power3.out" }, 0.1);
const step = Math.min(0.7, (d.duration * 0.6) / Math.max(1, rows.length));
rows.forEach((r, i) => {
  const at = d.times && d.times[i] != null ? d.times[i] : 0.45 + i * step;
  const p = r.querySelector("path"); const L = p.getTotalLength();
  gsap.set(p, { strokeDasharray: L, strokeDashoffset: L });
  tl.from(r, { x: -60, opacity: 0, duration: 0.45, ease: "expo.out" }, at)
    .from(r.querySelector(".chk"), { scale: 0, duration: 0.35, ease: "back.out(2.5)" }, at + 0.05)
    .to(p, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, at + 0.22);
});
tl.to(card, { opacity: 0, y: -24, duration: 0.35, ease: "power2.in" }, Math.max(1.5, d.duration - 0.35));
</script></body></html>
