<!doctype html>
<!-- shape_wipe: full-frame stylised transition (alpha). Place it centred on a cut; the frame is fully covered at duration/2.
     data: {style: bars|circle|diagonal, colors: ["#FFE14D", "#FF4D6D", "#111"], direction: left|right|up, duration: 0.8, brand} -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/__mg/base.css">
<style> .s { position: absolute; } </style></head>
<body><div id="stage" data-composition-id="main"></div>
<script src="/__vendor/gsap.min.js"></script><script src="/__mg/vedit.js"></script>
<script>
const d = V.data({ style: "bars", colors: ["#FFE14D", "#FF4D6D", "#111111"], direction: "left", duration: 0.8 });
V.brand(d.brand || {});
const stage = document.getElementById("stage"); stage.dataset.duration = d.duration;
const W = innerWidth, H = innerHeight, half = d.duration / 2;
const tl = V.timeline("main");
if (d.style === "circle") {
  const c = document.createElement("div"); c.className = "s"; const R = Math.hypot(W, H);
  Object.assign(c.style, { width: R * 2 + "px", height: R * 2 + "px", left: W / 2 - R + "px", top: H / 2 - R + "px", borderRadius: "50%", background: d.colors[0] });
  stage.appendChild(c);
  tl.fromTo(c, { scale: 0 }, { scale: 1, duration: half, ease: "power3.in" }, 0)
    .to(c, { scale: 0, duration: half, ease: "power3.out" }, half);
} else {
  const n = d.style === "diagonal" ? 3 : d.colors.length;
  for (let i = 0; i < n; i++) {
    const b = document.createElement("div"); b.className = "s"; b.style.background = d.colors[i % d.colors.length];
    const vertical = d.direction === "up";
    Object.assign(b.style, vertical ? { left: 0, width: W + "px", height: H * 1.2 + "px", top: H + "px" }
                                    : { top: d.style === "diagonal" ? -H * 0.25 + "px" : 0, height: d.style === "diagonal" ? H * 1.5 + "px" : H + "px",
                                        width: W * 1.3 + "px", left: (d.direction === "right" ? -W * 1.3 : W) + "px",
                                        transform: d.style === "diagonal" ? "skewX(-18deg)" : "none" });
    stage.appendChild(b);
    const inProp = vertical ? { top: -H * 0.1 } : { left: -W * 0.15 };
    const outProp = vertical ? { top: -H * 1.3 } : { left: d.direction === "right" ? W * 1.2 : -W * 1.5 };
    tl.to(b, { ...inProp, duration: half * 0.9, ease: "power3.inOut" }, i * 0.05)
      .to(b, { ...outProp, duration: half * 0.9, ease: "power3.inOut" }, half + (n - 1 - i) * 0.04);
  }
}
</script></body></html>
